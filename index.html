<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSEN SAKIT/IZIN 7D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial Black;min-height:100vh;display:flex;justify-content:center;padding:16px}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#ffeb3b,#e10600 40%,#000 80%);z-index:0}
#blur{position:fixed;inset:0;backdrop-filter:blur(40px);background:rgba(0,0,0,0.6);z-index:1}
#wrap{position:relative;z-index:10;width:100%;max-width:380px}
#card{background:#fff;color:#000;border-radius:30px;border:5px solid #000;box-shadow:0 0 0 4px #fff,0 0 80px rgba(225,6,0,0.6);overflow:hidden}
#top{background:#000;color:#fff;padding:22px;text-align:center}
#top h1{font-size:38px;letter-spacing:4px;line-height:0.9}
#top h1 span{color:#ffeb3b}
#top p{font-family:Arial;font-size:9px;letter-spacing:4px;color:#888;margin-top:6px}
#content{padding:20px}
#user{font-family:Arial;font-size:11px;font-weight:900;background:#000;color:#fff;padding:8px 14px;border-radius:999px;display:inline-block;margin-bottom:14px;border:2px solid #000}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn{padding:18px;border:4px solid #000;border-radius:18px;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 5px 0 #000;transition:0.1s;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.active{transform:translateY(4px);box-shadow:0 1px 0 #000;outline:4px solid #000}
#sakit{background:#ffeb3b;color:#000} #izin{background:#7c3aed;color:#fff}
#alasan{width:100%;padding:14px;border:4px solid #000;border-radius:14px;font-family:Arial;font-weight:900;margin-bottom:14px;min-height:80px;resize:none}
#kirim{width:100%;padding:16px;background:#000;color:#fff;border:4px solid #000;border-radius:18px;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;box-shadow:0 6px 0 #000;transition:0.1s}
#kirim:active{transform:translateY(4px);box-shadow:0 2px 0 #000}
#kirim:disabled{background:#999}
#status{font-family:Arial;font-size:11px;font-weight:900;text-align:center;margin-top:12px;min-height:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:12px 20px;border-radius:999px;border:3px solid #fff;font-family:Arial;font-size:11px;font-weight:900;transition:0.4s;z-index:200}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="bg"></div><div id="blur"></div>
<div id="wrap">
<div id="card">
<div id="top">
<h1>SAKIT<span>/</span>IZIN</h1>
<p>ABSENSI 7D • SMPKUBA</p>
</div>
<div id="content">
<div id="user">Loading...</div>

<div id="grid">
<button class="btn" id="sakit" onclick="pilih('Sakit')">🤒<br>SAKIT</button>
<button class="btn" id="izin" onclick="pilih('Izin')">📝<br>IZIN</button>
</div>

<textarea id="alasan" placeholder="Tulis alasan sakit/izin lu... (wajib)"></textarea>

<button id="kirim" onclick="kirim()">KIRIM KE GURU 🚀</button>
<div id="status"></div>

<div style="margin-top:16px;background:#f5f5f5;border:3px solid #000;border-radius:14px;padding:10px">
<div style="font-size:10px;letter-spacing:2px;margin-bottom:6px">📋 HARI INI SAKIT/IZIN:</div>
<div id="log" style="font-family:Arial;font-size:10px;color:#666">Belum ada</div>
</div>

<a href="./" style="display:block;text-align:center;margin-top:14px;font-family:Arial;font-size:10px;color:#999;text-decoration:none">← KEMBALI</a>
<div style="text-align:center;font-family:Arial;font-size:7px;color:#ccc;margin-top:6px">Kirim ke: doyzzkaciw@gmail.com</div>
</div>
</div>
</div>
<div id="toast"></div>

<script>
const EMAIL='doyzzkaciw@gmail.com';
let tipe='';
let nama=localStorage.getItem('7D_USER')||'';
if(!localStorage.getItem('7D_LOGIN')) location.href='./';
document.getElementById('user').textContent='👤 '+nama.toUpperCase();

function pilih(t){
  tipe=t;
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(t.toLowerCase()).classList.add('active');
  document.getElementById('alasan').placeholder='Tulis alasan '+t.toLowerCase()+' lu... (wajib)';
  document.getElementById('alasan').focus();
}
function toast(m){
  let el=document.getElementById('toast');
  el.textContent=m; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}
function load(){
  let logs=JSON.parse(localStorage.getItem('ABSEN_SAKIT_IZIN')||'[]');
  let today=new Date().toDateString();
  let todayLogs=logs.filter(l=>l.date===today);
  let logDiv=document.getElementById('log');
  if(todayLogs.length==0){ logDiv.textContent='Belum ada'; return; }
  logDiv.innerHTML='';
  todayLogs.reverse().forEach(l=>{
    let d=document.createElement('div');
    d.style.padding='4px 0'; d.style.borderBottom='1px dashed #ccc';
    d.innerHTML=`<b>${l.nama}</b> - ${l.tipe} (${l.time})<br><span style="color:#888">${l.alasan}</span>`;
    logDiv.appendChild(d);
  });
}
load();

async function kirim(){
  let alasan=document.getElementById('alasan').value.trim();
  let status=document.getElementById('status');
  let btn=document.getElementById('kirim');

  if(!tipe){ toast('❌ Pilih Sakit atau Izin dulu!'); return; }
  if(!alasan){ toast('❌ Isi alasan dulu jir!'); document.getElementById('alasan').style.borderColor='#e10600'; return; }
  if(alasan.length<5){ toast('❌ Alasan kependekan!'); return; }

  btn.disabled=true; btn.textContent='MENGIRIM...';
  status.textContent='Mengirim ke '+EMAIL+'...';

  let now=new Date();
  let data={
    nama:nama,
    tipe:tipe,
    alasan:alasan,
    waktu:now.toLocaleString('id-ID'),
    tanggal:now.toLocaleDateString('id-ID'),
    jam:now.toLocaleTimeString('id-ID')
  };

  try{
    await fetch('https://formsubmit.co/ajax/'+EMAIL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({
        _subject:'[7D] '+tipe.toUpperCase()+' - '+nama+' - '+data.tanggal,
        _template:'table',
        _captcha:'false',
        Nama:nama,
        Kelas:'7D SMPKUBA',
        Tipe:tipe,
        Alasan:alasan,
        Tanggal:data.tanggal,
        Jam:data.jam,
        Waktu:data.waktu
      })
    });

    let logs=JSON.parse(localStorage.getItem('ABSEN_SAKIT_IZIN')||'[]');
    logs.push({nama:nama,tipe:tipe,alasan:alasan,time:data.jam,date:new Date().toDateString(),full:data.waktu});
    localStorage.setItem('ABSEN_SAKIT_IZIN',JSON.stringify(logs));
    load();

    status.textContent='✅ '+tipe+' terkirim ke '+EMAIL+'!';
    status.style.color='#25D366';
    btn.textContent='✅ TERKIRIM!';
    toast('✅ '+tipe+' berhasil dikirim!');
    document.getElementById('alasan').value='';

  }catch(e){
    // fallback mailto
    window.open(`mailto:${EMAIL}?subject=[7D] ${tipe} - ${nama} - ${data.tanggal}&body=Nama: ${nama}%0AKelas: 7D%0ATipe: ${tipe}%0AAlasan: ${alasan}%0ATanggal: ${data.tanggal}%0AJam: ${data.jam}`,'_blank');
    status.textContent='✅ Disimpan, buka Gmail untuk kirim';
    btn.disabled=false; btn.textContent='KIRIM KE GURU 🚀';
  }
}
</script>
</body>
</html>
