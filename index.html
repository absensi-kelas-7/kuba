<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABSEN 7D SMPKUBA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{background:#000;display:flex;justify-content:center;align-items:center;font-family:Arial Black}
#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#7c3aed,#1e0a5e,#000);z-index:0}
#blur{position:fixed;inset:0;backdrop-filter:blur(30px);background:rgba(0,0,0,0.6);z-index:1}
#wrap{position:relative;z-index:10;width:96%;max-width:420px}
#card{background:white;border-radius:26px;overflow:hidden;border:4px solid black;box-shadow:0 0 60px rgba(124,58,237,0.7)}
#top{background:#e10600;padding:16px;text-align:center}
#top h1{color:white;font-size:48px;letter-spacing:5px;text-shadow:3px 3px 0 black}
#top p{color:white;letter-spacing:4px;font-size:13px}
#mid{padding:22px;display:flex;align-items:center;justify-content:center;background:white;border-top:4px solid black;border-bottom:4px solid black}
#graffiti{font-family:Impact;font-size:52px;line-height:0.9;color:#5b21b6;transform:rotate(-4deg) skew(-7deg);text-shadow:4px 4px 0 white,9px 9px 0 #1e1b4b;text-align:center}
#content{padding:14px;background:#f4f4f5}
#nama{width:100%;padding:13px;border:3px solid black;border-radius:12px;font-family:Arial;font-weight:900;margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.btnAbsen{padding:18px;border:3px solid black;border-radius:18px;font-weight:900;font-size:16px;cursor:pointer;transition:0.1s;color:white}
.btnAbsen:active{transform:scale(0.94)}
#btnSakit{background:#f59e0b} #btnIzin{background:#3b82f6}
#list{max-height:22vh;overflow-y:auto;background:white;border:3px solid black;border-radius:12px;padding:8px;margin-bottom:10px}
.item{font-family:Arial;font-size:11px;font-weight:800;padding:6px;display:flex;justify-content:space-between;border-bottom:1px solid #eee}
#kirim{width:100%;padding:13px;background:black;color:white;border:3px solid black;border-radius:999px;font-weight:900}

/* ANIMASI - TEKS GAK PATAH */
#anim{position:fixed;inset:0;z-index:99;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.92)}
#anim.show{display:flex}
#absenText{font-family:Impact;white-space:nowrap; /* INI BIAR GAK PATAH PUNG */ font-size:80px;color:white;letter-spacing:4px;text-shadow:0 0 30px #7c3aed,6px 6px 0 black;transform:scale(0.05);animation:absenAnim 3.5s cubic-bezier(0.34,1.56,0.64,1) forwards}
@keyframes absenAnim{
  0%{transform:scale(0.05);opacity:0;filter:blur(20px)}
  30%{transform:scale(1.15);opacity:1;filter:blur(0)}
  40%{transform:scale(1);opacity:1}
  65%{transform:scale(1);opacity:1} /* DIEM 1 DETIK DI TENGAH */
  100%{transform:scale(28);opacity:0;filter:blur(25px)}
}
</style>
</head>
<body>
<div id="bg"></div><div id="blur"></div>

<div id="wrap">
<div id="card">
  <div id="top"><h1>HELLO</h1><p>MY NAME IS</p></div>
  <div id="mid"><div id="graffiti">sevennde<br>smpkuba</div></div>
  <div style="background:#e10600;height:16px;border-top:4px solid black"></div>
  <div id="content">
    <input id="nama" placeholder="Nama lu (Doyz - 7D)">
    <!-- TOMBOL ABSEN ADA DISINI PUNG -->
    <div class="row">
      <button class="btnAbsen" id="btnSakit" onclick="absen('SAKIT')">🤒 SAKIT</button>
      <button class="btnAbsen" id="btnIzin" onclick="absen('IZIN')">📄 IZIN</button>
    </div>
    <div id="list"><div style="font-family:Arial;font-size:11px;text-align:center;color:#999;padding:8px">Belum ada absen sakit/izin</div></div>
    <button id="kirim">📧 KIRIM KE GMAIL</button>
  </div>
</div>
</div>

<!-- ANIMASI FULL LAYAR -->
<div id="anim"><div id="absenText">ABSEN 7D - <span id="st"></span></div></div>

<script>
const KEY='smpkuba_fix_not_break';
let data=JSON.parse(localStorage.getItem(KEY)||'[]');
const namaEl=document.getElementById('nama');
namaEl.value=localStorage.getItem(KEY+'_nama')||'';
namaEl.oninput=()=>localStorage.setItem(KEY+'_nama',namaEl.value);

function render(){
  const list=document.getElementById('list');
  if(data.length==0){list.innerHTML='<div style="font-family:Arial;font-size:11px;text-align:center;color:#999;padding:8px">Belum ada absen sakit/izin</div>';return;}
  list.innerHTML='';
  data.slice().reverse().forEach(d=>{
    const div=document.createElement('div'); div.className='item';
    let c=d.status=='SAKIT'?'#f59e0b':'#3b82f6';
    div.innerHTML=`<span>${d.nama}</span><span style="color:${c}">${d.status}</span>`;
    list.appendChild(div);
  });
}

function absen(status){
  const nama=namaEl.value.trim()||'ANONIM 7D';
  data.push({nama,status,tgl:new Date().toLocaleDateString('id-ID')});
  localStorage.setItem(KEY,JSON.stringify(data));
  render();
  
  // ANIMASI TEKS GAK PATAH
  const anim=document.getElementById('anim');
  document.getElementById('st').textContent=status;
  const txt=document.getElementById('absenText');
  anim.classList.add('show');
  txt.style.animation='none'; void txt.offsetWidth;
  txt.style.animation='absenAnim 3.5s cubic-bezier(0.34,1.56,0.64,1) forwards';
  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  setTimeout(()=>anim.classList.remove('show'),3300);
}

document.getElementById('kirim').onclick=async()=>{
  if(data.length==0){alert('Belum ada data!');return;}
  let msg=data.map(d=>`${d.nama} - ${d.status} - ${d.tgl}`).join('\n');
  try{
    await fetch('https://formsubmit.co/ajax/doyzzkaciw@gmail.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:'ABSEN 7D SAKIT IZIN',message:msg,_captcha:'false'})});
    alert('✅ Kekirim ke Gmail!');
  }catch{ location.href=`mailto:doyzzkaciw@gmail.com?body=${encodeURIComponent(msg)}`; }
};

render();
</script>
</body>
</html>
