<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SEVENNDE SMPKUBA - FULLSCREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:#000;font-family:Arial Black;position:relative}

#bg{position:fixed;inset:0;background:radial-gradient(circle at 50% 25%,#7c3aed 0%,#3b0764 35%,#000 80%);z-index:0;animation:bgpulse 3s infinite alternate}
@keyframes bgpulse{0%{filter:brightness(1)}100%{filter:brightness(1.3) hue-rotate(15deg)}}

#blur{position:fixed;inset:0;backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);background:rgba(0,0,0,0.55);z-index:1}

/* CARD UTAMA */
#card{position:relative;z-index:5;width:92vw;max-width:460px;background:white;border-radius:28px;overflow:hidden;border:4px solid black;box-shadow:0 0 70px rgba(124,58,237,0.7),0 30px 90px rgba(0,0,0,1);transform:rotate(-1deg);animation:cardFloat 4s infinite ease-in-out}
@keyframes cardFloat{0%,100%{transform:rotate(-1deg) translateY(0)}50%{transform:rotate(-0.5deg) translateY(-8px)}}

#top{background:#e10600;padding:20px;text-align:center;position:relative}
#top h1{color:white;font-size:58px;letter-spacing:7px;line-height:0.9;text-shadow:4px 4px 0 black}
#top p{color:white;font-size:17px;letter-spacing:6px;margin-top:4px}
#spray{position:absolute;left:50%;top:80%;transform:translateX(-50%);width:200px;height:20px;background:#6e0000;border-radius:50%;filter:blur(5px)}

#mid{padding:34px 20px;min-height:190px;display:flex;align-items:center;justify-content:center;position:relative;background:white;border-top:4px solid black;border-bottom:4px solid black}
#graffiti{font-family:Impact,Arial Black;font-size:60px;line-height:0.85;color:#5b21b6;text-transform:lowercase;transform:rotate(-4deg) skew(-7deg);text-shadow:5px 5px 0 white,11px 11px 0 #1e1b4b,0 0 40px rgba(91,33,182,1);text-align:center;letter-spacing:-1px}
#angkatan{position:absolute;right:10px;top:14px;writing-mode:vertical-rl;font-size:12px;letter-spacing:3px;font-weight:900}

#bottom{background:#e10600;height:26px}

/* ANIMASI ABSEN 7D FULL LAYAR */
#animWrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden}
#absenText{font-family:Impact,Arial Black;font-size:120px;color:white;text-transform:uppercase;letter-spacing:8px;text-shadow:0 0 20px #7c3aed,0 0 60px #e10600,6px 6px 0 black;opacity:0;transform:scale(0.05);animation:absenAnim 4s cubic-bezier(0.34,1.56,0.64,1) forwards}

@keyframes absenAnim{
  0%{transform:scale(0.05) rotate(-10deg);opacity:0;filter:blur(10px)}
  25%{transform:scale(1.15) rotate(2deg);opacity:1;filter:blur(0)}
  35%{transform:scale(1) rotate(0deg);opacity:1}
  /* DIEM 1 DETIK DI TENGAH (35% - 60% = 1 detik dari 4 detik) */
  60%{transform:scale(1) rotate(0deg);opacity:1}
  100%{transform:scale(18) rotate(5deg);opacity:0;filter:blur(20px)}
}

/* PARTICLE */
.particle{position:fixed;width:8px;height:8px;background:#7c3aed;border-radius:50%;z-index:19;pointer-events:none;animation:pop 4s forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

#tap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:30;background:black;color:white;padding:10px 22px;border-radius:999px;border:2px solid white;font-size:11px;letter-spacing:2px;cursor:pointer;animation:tapPulse 1.5s infinite}
@keyframes tapPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}
</style>
</head>
<body>

<div id="bg"></div>
<div id="blur"></div>

<div id="card">
  <div id="top">
    <h1>HELLO</h1>
    <p>MY NAME IS</p>
    <div id="spray"></div>
  </div>
  <div id="mid">
    <div id="graffiti">sevennde<br>smpkuba</div>
    <div id="angkatan">ANGKATAN 2026</div>
  </div>
  <div id="bottom"></div>
</div>

<div id="animWrap">
  <div id="absenText">ABSEN 7D</div>
</div>

<div id="tap">TAP UNTUK REPLAY</div>

<script>
const text = document.getElementById('absenText');
const wrap = document.getElementById('animWrap');
const tap = document.getElementById('tap');

function createParticles(){
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left='50%'; p.style.top='50%';
    p.style.setProperty('--x', (Math.random()*800-400)+'px');
    p.style.setProperty('--y', (Math.random()*800-400)+'px');
    p.style.background = i%2 ? '#e10600' : '#7c3aed';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),4000);
  }
}

function play(){
  text.style.animation='none';
  void text.offsetWidth; // restart
  text.style.animation='absenAnim 4s cubic-bezier(0.34,1.56,0.64,1) forwards';
  createParticles();
  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  tap.style.display='none';
  setTimeout(()=>tap.style.display='block',3800);
}

tap.onclick = play;
document.body.onclick = (e)=>{ if(e.target.id!=='tap') play(); };

// auto play pertama
setTimeout(play, 600);
</script>

</body>
</html>
